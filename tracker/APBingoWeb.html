<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AP Bingo Board</title>

</head>

<body class="theme-current">

    <style>
        :root {
            --page-background: #07111f;
            --cell-available: #0072ff;
            --cell-completed: forestgreen;
            --cell-text: white;
        }

        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            color: var(--cell-text);
            font-family: Arial, sans-serif;
        }

        #configMenu {
            display: none;
            position: fixed;
            inset: 50% auto auto 50%;
            transform: translate(-50%, -50%);
            width: min(420px, calc(100vw - 32px));
            max-height: 80vh;
            overflow-y: auto;
            padding: 20px;
            border: 2px solid rgba(255, 255, 255, 0.65);
            border-radius: 12px;
            background: rgba(4, 10, 20, 0.96);
            color: white;
            z-index: 1001;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        }

        #configMenu h2 {
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            text-align: center;
        }

        #configBackdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
            z-index: 1000;
        }

        .config-field {
            margin: 14px 0;
        }

        .config-field label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .config-field input,
        .config-field select {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .config-field input::placeholder {
            color: rgba(255, 255, 255, 0.55);
        }

        .input-with-toggle {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-with-toggle input {
            padding-right: 70px;
        }

        .toggle-visibility {
            position: absolute;
            right: 8px;
            border: none;
            background: none;
            color: white;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px 6px;
        }

        .toggle-visibility:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .config-description {
            margin-top: 4px;
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.7);
        }

        .config-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .config-buttons button,
        #configToggle {
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
        }

        .config-buttons button {
            flex: 1;
            padding: 10px;
            font-weight: 700;
        }

        .config-buttons button:hover,
        #configToggle:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #configToggle {
            position: fixed;
            top: 12px;
            right: 12px;
            padding: 10px 12px;
            z-index: 999;
        }

        .inline-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .inline-toggle input {
            width: auto;
        }

        body.theme-current {
            --cell-available: #0072ff;
            --cell-completed: forestgreen;
            --cell-text: white;
        }

        body.theme-red-green {
            --cell-available: #c62828;
            --cell-completed: #2e7d32;
            --cell-text: #fff8f5;
        }

        body.theme-amber-teal {
            --cell-available: #ffb300;
            --cell-completed: #00897b;
            --cell-text: #fffde7;
        }

        body.theme-slate-lime {
            --cell-available: #455a64;
            --cell-completed: #8bc34a;
            --cell-text: #f5f7fa;
        }

        body.theme-rose-cyan {
            --cell-available: #d81b60;
            --cell-completed: #00acc1;
            --cell-text: #fff7fb;
        }

        body.theme-white-black {
            --cell-available: #ffffff;
            --cell-completed: #000000;
            --cell-text: #000000;
        }

        body.theme-silver-gold {
            --cell-available: rgb(113, 113, 113);
            --cell-completed: rgb(142, 121, 0);
            --cell-text: #fff7fb;
        }

        body.theme-red-blue {
            --cell-available: #c62828;
            --cell-completed: #0072ff;
            --cell-text: #fff7fb;
        }

        body.theme-purple-lime {
            --cell-available: purple;
            --cell-completed: #8bc34a;
            --cell-text: #8bc34a;
        }

        body.theme-yellow-pink {
            --cell-available: rgb(142, 121, 0);
            --cell-completed: deeppink;
            --cell-text: white;
        }

        body.theme-amber-green {
            --cell-available: #ffb300;
            --cell-completed: #2e7d32;
            --cell-text: #fffde7;
        }

        body.theme-clouds {
            --cell-available: #0072ff;
            --cell-completed: #fffde7;
            --cell-text: #fffde7;
        }


        table {
            width: 100vw;
            height: 100vh;
        }

        .cell {
            background-color: var(--cell-available);
            color: var(--cell-text);
        }

        .cell.completed {
            background-color: var(--cell-completed);
        }

        .cell {
            padding: 4px;
            font-weight: 900;

        }

        td {
            min-width: 48px;
            min-height: 48px;
            text-align: center;
        }



        .cell:not(.discovered) {
            font-size: 0;
        }
    </style>
    <style id="computed"> </style>
    <div id="configBackdrop"></div>
    <button id="configToggle" type="button">Settings</button>
    <div id="configMenu">
        <h2>Configuration</h2>
        <div class="config-field">
            <label for="configTheme">Theme</label>
            <select id="configTheme">
                <option value="current">Current (Blue/Green)</option>
                <option value="red-green">Red/Green</option>
                <option value="amber-teal">Amber/Teal</option>
                <option value="slate-lime">Slate/Lime</option>
                <option value="rose-cyan">Rose/Cyan</option>
                <option value="white-black">White/Black</option>
                <option value="silver-gold">Silver/Gold</option>
                <option value="red-blue">Red/Blue</option>
                <option value="purple-lime">Purple/Lime</option>
                <option value="yellow-pink">Yellow/Pink</option>
                <option value="amber-green">Amber/Green</option>
                <option value="clouds">Clouds</option>
            </select>
            <div class="config-description">Controls the available and completed cell colors.</div>
            <div class="config-preview">
                <div
                    style="display: inline-block; width: 20px; height: 20px; background-color: var(--cell-available); border: 1px solid rgba(255, 255, 255, 0.4); margin-right: 8px;">
                </div>
                <span>Available Cell</span>
                <div
                    style="display: inline-block; width: 20px; height: 20px; background-color: var(--cell-completed); border: 1px solid rgba(255, 255, 255, 0.4); margin-left: 16px; margin-right: 8px;">
                </div>
                <span>Completed Cell</span>
            </div>
        </div>
        <div class="config-field">
            <label for="configServer">AP Server</label>
            <div class="input-with-toggle">
                <input type="password" id="configServer" placeholder="archipelago.gg:38281">
                <button id="toggleServerBtn" class="toggle-visibility" type="button">Show</button>
            </div>
            <div class="config-description">Archipelago server address.</div>
        </div>
        <div class="config-field">
            <label for="configUsername">Username</label>
            <input type="text" id="configUsername" placeholder="Player1">
            <div class="config-description">Your Archipelago slot name.</div>
        </div>
        <div class="config-field">
            <label for="configPassword">Password</label>
            <input type="password" id="configPassword" placeholder="Optional">
            <div class="config-description">Leave blank if the room has no password.</div>
        </div>
        <div class="config-field">
            <label for="configBlind" class="inline-toggle">
                <input type="checkbox" id="configBlind">
                <span>Blind Mode</span>
            </label>
            <div class="config-description">Hide square text.</div>
        </div>
        <div class="config-buttons">
            <button id="applyConfigBtn" type="button">Apply & Reload</button>
            <button id="cancelConfigBtn" type="button">Cancel</button>
        </div>
    </div>
    <div id="grid"></div>
    <script type="module">
        // Default config
        let server = undefined;
        let password = "";
        let username = undefined;
        let blind = false;
        let theme = "current";
        const configStorageKey = "ap_bingo_config";
        let configMenuOpen = false;
        let configMenuRequired = false;
        let obsMode = false;
        let themeSnapshot = null;

        const themeOptions = {
            current: "theme-current",
            "red-green": "theme-red-green",
            "amber-teal": "theme-amber-teal",
            "slate-lime": "theme-slate-lime",
            "rose-cyan": "theme-rose-cyan",
            "white-black": "theme-white-black",
            "silver-gold": "theme-silver-gold",
            "red-blue": "theme-red-blue",
            "purple-lime": "theme-purple-lime",
            "yellow-pink": "theme-yellow-pink",
            "amber-green": "theme-amber-green",
            "clouds": "theme-clouds"
        };

        function applyTheme(themeName) {
            const normalizedThemeName = themeOptions[themeName] ? themeName : "current";
            const normalizedTheme = themeOptions[normalizedThemeName];
            document.body.classList.remove(...Object.values(themeOptions));
            document.body.classList.add(normalizedTheme);
            theme = normalizedThemeName;
        }

        function isObsEnvironment() {
            const userAgent = (navigator.userAgent || "").toLowerCase();
            return userAgent.includes("obs") || typeof window.obsstudio !== "undefined";
        }

        function loadSavedConfig() {
            try {
                const raw = localStorage.getItem(configStorageKey);
                return raw ? JSON.parse(raw) : {};
            }
            catch (error) {
                console.error("Unable to load saved config", error);
                return {};
            }
        }

        function saveConfig(config) {
            try {
                localStorage.setItem(configStorageKey, JSON.stringify(config));
            }
            catch (error) {
                console.error("Unable to save config", error);
            }
        }

        function loadCurrentConfig() {
            const params = new URLSearchParams(window.location.search);
            const savedConfig = loadSavedConfig();

            document.getElementById("configTheme").value = params.get("theme") || savedConfig.theme || "current";
            document.getElementById("configServer").value = params.get("server") || savedConfig.server || "";
            document.getElementById("configUsername").value = params.get("username") || savedConfig.username || "";
            document.getElementById("configPassword").value = params.get("password") || savedConfig.password || "";
            document.getElementById("configBlind").checked = params.has("blind")
                || (!!savedConfig.blind && !params.has("blind-off"));
            document.getElementById("configServer").type = "password";
            document.getElementById("toggleServerBtn").innerText = "Show";
        }

        function toggleServerVisibility() {
            const input = document.getElementById("configServer");
            const button = document.getElementById("toggleServerBtn");
            if (input.type === "password") {
                input.type = "text";
                button.innerText = "Hide";
            }
            else {
                input.type = "password";
                button.innerText = "Show";
            }
        }

        function openConfigMenu(required = false) {
            if (obsMode) {
                return;
            }
            themeSnapshot = theme;
            configMenuRequired = required;
            configMenuOpen = true;
            document.getElementById("configBackdrop").style.display = "block";
            document.getElementById("configMenu").style.display = "block";
            document.getElementById("cancelConfigBtn").style.display = required ? "none" : "block";
            loadCurrentConfig();
        }

        function closeConfigMenu() {
            if (configMenuRequired) {
                return;
            }
            if (themeSnapshot !== null) {
                applyTheme(themeSnapshot);
                themeSnapshot = null;
            }
            configMenuOpen = false;
            document.getElementById("configBackdrop").style.display = "none";
            document.getElementById("configMenu").style.display = "none";
        }

        function toggleConfigMenu() {
            if (configMenuOpen) {
                closeConfigMenu();
            }
            else {
                openConfigMenu(false);
            }
        }

        function applyConfigFromMenu() {
            const config = {
                theme: document.getElementById("configTheme").value || "current",
                server: document.getElementById("configServer").value.trim(),
                username: document.getElementById("configUsername").value.trim(),
                password: document.getElementById("configPassword").value,
                blind: document.getElementById("configBlind").checked
            };

            saveConfig(config);

            const params = new URLSearchParams();
            if (config.theme && config.theme !== "current") {
                params.set("theme", config.theme);
            }
            if (config.server) {
                params.set("server", config.server);
            }
            if (config.username) {
                params.set("username", config.username);
            }
            if (config.password) {
                params.set("password", config.password);
            }
            if (config.blind) {
                params.set("blind", "1");
            }

            const nextUrl = params.toString()
                ? window.location.pathname + "?" + params.toString()
                : window.location.pathname;
            window.location.href = nextUrl;
        }

        function promptObsConfig(params) {
            if (!params.has("server")) {
                const serverInput = prompt("Enter the Archipelago server address:", "archipelago.gg:");
                if (serverInput !== null) {
                    server = serverInput.trim();
                }
            }

            if (!params.has("username")) {
                const userInput = prompt("Enter your username:", username || "");
                if (userInput !== null) {
                    username = userInput.trim();
                }
            }

            if (!params.has("password")) {
                const passInput = prompt("Enter your password (leave blank if none):", password ?? "");
                if (passInput !== null) {
                    password = passInput;
                }
            }

            if (params.has("theme")) {
                applyTheme(params.get("theme"));
            }


        }

        async function loadConfig() {
            const params = new URLSearchParams(window.location.search);
            obsMode = isObsEnvironment();

            if (obsMode) {
                blind = params.has("blind");
                server = params.get("server");
                username = params.get("username");
                password = params.get("password") ?? "";
                applyTheme(params.get("theme") || "current");
                document.getElementById("configToggle").style.display = "none";
                document.getElementById("configBackdrop").style.display = "none";
                document.getElementById("configMenu").style.display = "none";
                promptObsConfig(params);
                if (!server || !username) {
                    document.title = "AP Bingo Board";
                    return false;
                }
                document.title = username + "'s AP Bingo Board";
                return true;
            }

            // Non-OBS: only auto-connect from URL params, never from saved config.
            // Saved config is only used to pre-fill the config menu.
            const savedConfig = loadSavedConfig();
            blind = params.has("blind") || (!!savedConfig.blind && !params.has("blind-off"));
            applyTheme(params.get("theme") || savedConfig.theme || "current");
            server = params.get("server") || null;
            username = params.get("username") || null;
            password = params.get("password") ?? "";

            if (!server || !username) {
                openConfigMenu(true);
                document.title = "AP Bingo Board";
                return false;
            }

            document.title = username + "'s AP Bingo Board";
            return true;
        }

        document.getElementById("configToggle").addEventListener("click", toggleConfigMenu);
        document.getElementById("applyConfigBtn").addEventListener("click", applyConfigFromMenu);
        document.getElementById("cancelConfigBtn").addEventListener("click", closeConfigMenu);
        document.getElementById("toggleServerBtn").addEventListener("click", toggleServerVisibility);
        document.getElementById("configBackdrop").addEventListener("click", closeConfigMenu);
        document.getElementById("configTheme").addEventListener("change", function () {
            applyTheme(this.value);
        });

        const configReady = await loadConfig();
        if (!configReady) {
            window.refreshGrid = () => { };
        }

        const AP = configReady
            ? await import('https://cdn.jsdelivr.net/npm/archipelago.js@2.0.4/+esm')
            : null;
        if (configReady && AP) {
            const ap_client = new AP.Client();
            window.ap_client = ap_client;
            let logData = await ap_client.login(server, username, "APBingo", { password, version: { major: 0, minor: 6, build: 3 }, items: AP.itemsHandlingFlags.all })
            ap_client.logData = logData
            ap_client.socket.on("disconnected", async () => {
                await ap_client.login(server, username, "APBingo", { password, version: { major: 0, minor: 6, build: 6 }, items: AP.itemsHandlingFlags.all }).catch(console.error)
            })
            ap_client.items.on("itemsReceived", (items) => {
                setTimeout(() => {
                    refreshGrid();
                }, 1);
            })
            setTimeout(() => {
                refreshGrid();
            }, 1);

            let connect_packet = { slot_data: ap_client.logData };
            //Build
            let tab = window.tab = {}

            let table = document.createElement("table");
            document.getElementById("grid").appendChild(table);

            let tr = document.createElement("tr");
            table.appendChild(tr);

            // Header row: empty corner + letters as columns
            let td = document.createElement("td");
            tr.appendChild(td);
            for (let j = 1; j <= connect_packet.slot_data.boardSize; j++) {
                td = document.createElement("td");
                td.innerText = String.fromCharCode(0x40 + j);
                tr.appendChild(td);
            }

            let playerTiles = {}
            // Data rows: number as row header, cells go across letters
            for (let i = 1; i <= connect_packet.slot_data.boardSize; i++) {
                tr = document.createElement("tr");
                table.appendChild(tr);
                td = document.createElement("td");
                td.innerText = "" + i;
                tr.appendChild(td);
                for (let j = 1; j <= connect_packet.slot_data.boardSize; j++) {
                    let letter = String.fromCharCode(0x40 + j);
                    td = document.createElement("td");
                    let pos = (j - 1) * connect_packet.slot_data.boardSize + (i - 1);
                    td.innerText = letter + i;
                    td.setAttribute("data-text", (blind ? "" : connect_packet.slot_data.boardLocations[pos]))

                    td.classList.add("cell");
                    tab[letter + i] = td;
                    tr.appendChild(td);
                }
            }
            let hintedSquares = new Set();
            async function hintSquare(square) {
                if (hintedSquares.has(square)) return;
                if (!ap_client.logData.autoHints) return;
                hintedSquares.add(square);

                let hintData = ap_client.logData.hintData;
                hintData = hintData.filter(x => x.itemName == square);
                let text = tab[square].getAttribute("data-text");
                let matches = Array.from(text.matchAll(/\(([^)]+)\)/g));
                let playerName = matches.length ? matches[matches.length - 1][1] : null;

                for (let hint of hintData) {
                    let hintSquare = hint.hintLocation;
                    //Find the player name from boardLocations

                    if (playerName == ap_client.players.slots[hint.player].name) {
                        await ap_client.socket.send({
                            cmd: `CreateHints`,
                            locations: [hint.id],
                            player: hint.player
                        })
                    }
                }

            }
            function refreshGrid() {

                document.querySelectorAll("td.cell").forEach(el => {
                    el.classList.remove("completed");
                    if (!ap_client.logData.fogOfWar) {
                        el.classList.add("discovered");
                    }
                })

                // for (let i = 0; i < 26; i++) {
                //     let letter = String.fromCharCode(0x41 + i);
                //     let tile = letter + "" + (26 - i);
                //     tab[tile].classList.add("completed");
                // }

                for (let it of ap_client.items.received) {
                    tab[it.name].classList.add("discovered");
                    tab[it.name].classList.add("completed");
                    tab[it.name].innerText = it.name;
                }

                if (tab[ap_client.logData.startSquare]) {
                    tab[ap_client.logData.startSquare].classList.add("discovered");

                    hintSquare(ap_client.logData.startSquare);
                }
                for (let tile of Object.keys(tab)) {
                    if (tab[tile].classList.contains("completed")) {
                        //Find the 4 next squares in the same row and column and mark them as discovered
                        let letter = tile[0];
                        let num = parseInt(tile.substring(1));

                        let left = String.fromCharCode(letter.charCodeAt(0) - 1) + num;
                        let right = String.fromCharCode(letter.charCodeAt(0) + 1) + num;
                        let up = letter + (num - 1);
                        let down = letter + (num + 1);

                        for (let pos of [left, right, up, down]) {
                            if (tab[pos]) {
                                tab[pos].classList.add("discovered");
                                hintSquare(pos);
                            }
                        }
                    }
                }
                for (let tile of Object.keys(tab)) {
                    if (tab[tile].classList.contains("completed")) {
                        tab[tile].classList.add("discovered");
                    }

                    if (tab[tile].classList.contains("discovered") && !tab[tile].classList.contains("completed")) {
                        if (!blind) {
                            tab[tile].innerText = tile + " : " + tab[tile].getAttribute("data-text");
                        }
                    }
                }



                //Validate bingo and send checks

                let bingos = {

                };

                function readBingo(id, name) {
                    let descriptor = (name.match(/\(([^\)]+)\)/)[1]);
                    if (!bingos[descriptor]) {
                        bingos[descriptor] = {
                            descriptor,
                            completed: false,
                            checks: []
                        }
                    }
                    bingos[descriptor].checks.push(id);
                    return name;
                }

                (ap_client.room.checkedLocations.map(id => readBingo(id, ap_client.package.lookupLocationName("APBingo", id))));
                (ap_client.room.missingLocations.map(id => readBingo(id, ap_client.package.lookupLocationName("APBingo", id))));

                Object.values(bingos).forEach(bingo => {
                    //Check this bingo
                    if (bingo.descriptor == "ALL" || bingo.descriptor == "Blackout") {
                        bingo.completed = document.querySelectorAll(".cell").length == document.querySelectorAll(".completed").length;
                    }
                    else if (bingo.descriptor == "Corners") {
                        //Check the 4 corners
                        let corners = ["A1", "A" + connect_packet.slot_data.boardSize,
                            String.fromCharCode(0x40 + connect_packet.slot_data.boardSize) + "1",
                            String.fromCharCode(0x40 + connect_packet.slot_data.boardSize) + connect_packet.slot_data.boardSize];
                        let is_completed = true;
                        for (let corner of corners) {
                            try {
                                if (!tab[corner]) throw new Error("Invalid cell: " + corner);
                                if (!tab[corner].classList.contains("completed")) {
                                    is_completed = false;
                                    break;
                                }
                            }
                            catch (e) {
                                console.error(e);
                                continue;
                            }
                        }
                        bingo.completed = is_completed;
                    }
                    else if (bingo.descriptor == "Pictureframe") {
                        //Check the border cells
                        let is_completed = true;
                        for (let i = 1; i <= connect_packet.slot_data.boardSize; i++) {
                            for (let j = 1; j <= connect_packet.slot_data.boardSize; j++) {
                                let cell = String.fromCharCode(0x40 + j) + i;
                                if (i == 1 || i == connect_packet.slot_data.boardSize || j == 1 || j == connect_packet.slot_data.boardSize) {
                                    try {
                                        if (!tab[cell]) throw new Error("Invalid cell: " + cell);
                                        if (!tab[cell].classList.contains("completed")) {
                                            is_completed = false;
                                            break;
                                        }
                                    }
                                    catch (e) {
                                        console.error(e);
                                        continue;
                                    }
                                }
                            }
                        }
                        bingo.completed = is_completed;
                    }
                    else if (bingo.descriptor == "Checkerboard") {
                        //Check the checkerboard pattern
                        let is_completed = true;
                        for (let i = 1; i <= connect_packet.slot_data.boardSize; i++) {
                            for (let j = 1; j <= connect_packet.slot_data.boardSize; j++) {
                                //Check only even or odd cells
                                if ((i + j) % 2 == 0) {
                                    let cell = String.fromCharCode(0x40 + j) + i;
                                    try {
                                        if (!tab[cell]) throw new Error("Invalid cell: " + cell);
                                        if (!tab[cell].classList.contains("completed")) {
                                            is_completed = false;
                                            break;
                                        }
                                    }
                                    catch (e) {
                                        console.error(e);
                                        continue;
                                    }
                                }
                            }
                        }
                        bingo.completed = is_completed;
                    }
                    else if (bingo.descriptor == "Reverse Checkerboard") {
                        //Check the reverse checkerboard pattern
                        let is_completed = true;
                        for (let i = 1; i <= connect_packet.slot_data.boardSize; i++) {
                            for (let j = 1; j <= connect_packet.slot_data.boardSize; j++) {
                                //Check only even or odd cells
                                if ((i + j) % 2 == 1) {
                                    let cell = String.fromCharCode(0x40 + j) + i;
                                    try {
                                        if (!tab[cell]) throw new Error("Invalid cell: " + cell);
                                        if (!tab[cell].classList.contains("completed")) {
                                            is_completed = false;
                                            break;
                                        }
                                    }
                                    catch (e) {
                                        console.error(e);
                                        continue;
                                    }
                                }
                            }
                        }
                        bingo.completed = is_completed;
                    }
                    else {
                        /**
                         * @type {string[]}
                         */
                        let parts = bingo.descriptor.split("-");
                        let letterBegin = parts[0][0];
                        let letterEnd = parts[1][0];
                        parts = parts.map(x => parseInt(x.substring(1)));
                        let letterVariation = Math.sign(letterEnd.charCodeAt(0) - letterBegin.charCodeAt(0))

                        let numVariation = Math.sign((parts[1] - parts[0]));

                        let is_completed = true;
                        for (let i = 0; i < connect_packet.slot_data.boardSize; i++) {
                            let letter = String.fromCharCode(letterBegin.charCodeAt(0) + i * letterVariation);
                            let num = parts[0] + i * numVariation;
                            let cell = letter + num;
                            try {
                                if (!tab[cell]) throw new Error("Invalid cell: " + cell);
                            }
                            catch (e) {
                                console.error(e);
                                continue;
                            }
                            is_completed &= !!tab[cell].classList.contains("completed");
                        }
                        bingo.completed = !!is_completed;
                    }
                    //Send checks for that row
                    if (bingo.completed) {
                        console.log("Completed bingo: " + bingo.descriptor);
                        ap_client.check(...bingo.checks);
                    }
                })

                if (Object.values(bingos).filter(x => x.completed).length >= connect_packet.slot_data.requiredBingoCount) {
                    //Trigger goal
                    console.log("Triggering goal");
                    ap_client.check(...ap_client.room.missingLocations) //Bingo(ALL)
                    ap_client.goal();
                }
            }
            window.refreshGrid = refreshGrid;

            // document.getElementById("computed").innerHTML = ".cell{ color: " + connect_packet.slot_data.customText + "}" +
            //     "body{ background-color: " + connect_packet.slot_data.customBoard + "}" +
            //     ".cell{ background-color: " + connect_packet.slot_data.customSquare + "}" +
            //     ".cell.completed{ background-color: " + connect_packet.slot_data.customHLSquare + "}";
        }


    </script>
