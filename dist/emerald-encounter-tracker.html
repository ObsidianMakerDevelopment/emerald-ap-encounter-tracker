var Versions = class {
	static v067 = "v067";
	static v300 = "v300";
};
var gVersion = Versions.v067;
/**
* 
* @param {string} version 
*/
function setVersion(version) {
	gVersion = version;
}
/**
* @param {string|undefined} version 
*/
function getData(version) {

//#region tracker/tokensDecoder.mjs
var APTokenTypes = class {
	static WRITE = 0;
	static COPY = 1;
	static RLE = 2;
	static AND_8 = 3;
	static OR_8 = 4;
	static XOR_8 = 5;
};
emerald_data.misc_rom_addresses;
function decodeTokenData(arrayBuffer, base_patch_checksum) {
	let version = Versions.v067;
	if (!base_patch_checksum) version = Versions.v067;
	else if (base_patch_checksum == "65a5632d20742e9f6a41f91b45048f27") version = Versions.v300;
	setVersion(version);
	let rom_data = getData(version);
	let numberOfToken = new DataView(arrayBuffer).getUint32(0, true);
	let tokens = [];
	let offset = 4;
	for (let i = 0; i < numberOfToken; i++) {
		let type = new DataView(arrayBuffer).getUint8(offset);
		offset += 1;
		let position = new DataView(arrayBuffer).getUint32(offset, true);
		offset += 4;
		if (type == APTokenTypes.XOR_8 || type == APTokenTypes.AND_8 || type == APTokenTypes.OR_8) {
			let oneByteValue = new DataView(arrayBuffer).getUint32(offset);
			offset += 4;
			if (oneByteValue != 1) {
				console.error("Unexpected value for XOR/AND/OR token. Expected 1, got: " + oneByteValue);
				return tokens;
			}
			let value = new DataView(arrayBuffer).getUint8(offset);
			offset += 1;
			tokens.push({
				type,
				position,
				args: value
			});
		} else if (type == APTokenTypes.COPY || type == APTokenTypes.RLE) {
			new DataView(arrayBuffer).getUint32(offset, true);
			offset += 4;
			let value1 = new DataView(arrayBuffer).getUint32(offset, true);
			offset += 4;
			let value2 = new DataView(arrayBuffer).getUint32(offset, true);
			offset += 4;
			tokens.push({
				type,
				position,
				args: [value1, value2]
			});
		} else if (type == APTokenTypes.WRITE) {
			let length = new DataView(arrayBuffer).getUint32(offset, true);
			offset += 4;
			let valueBytes = new Uint8Array(arrayBuffer.slice(offset, offset + length));
			offset += length;
			tokens.push({
				type,
				position,
				args: valueBytes
			});
		} else {
			console.error("Unknown token type: " + type);
			return tokens;
		}
	}
	for (let token of tokens) if (token.type == APTokenTypes.WRITE) {
		if (token.position == rom_data.misc_rom_addresses["gArchipelagoOptions"] + 32) {
			token.name = "Free Fly Location";
			token.value = token.args[0];
		} else if (token.position >= rom_data.misc_rom_addresses["sNewGamePCItems"] && token.position < rom_data.misc_rom_addresses["sNewGamePCItems"] + 80) token.name = "PC Item Slot " + (token.position - rom_data.misc_rom_addresses["sNewGamePCItems"]) / 4;
		for (let mapKey in rom_data.maps) {
			let map = rom_data.maps[mapKey];
			if ("land_encounters" in map) for (let i = 0; i < map.land_encounters.slots.length; i++) {
				let address = map.land_encounters.address + 2 + 4 * i;
				if (token.position == address) {
					token.name = "Land Encounter Slot " + i + " on Map " + mapKey;
					token.dexsanity = true;
					token.map = mapKey;
					token.encounter_type = "Land";
					token.species = new Uint16Array(token.args.buffer)[0];
					if (mapKey == "MAP_MT_PYRE_SUMMIT") console.log("Map Mt Pyre Summit", mapKey, token, token.args);
				}
			}
			if ("water_encounters" in map) for (let i = 0; i < map.water_encounters.slots.length; i++) {
				let address = map.water_encounters.address + 2 + 4 * i;
				if (token.position == address) {
					token.name = "Water Encounter Slot " + i + " on Map " + mapKey;
					token.dexsanity = true;
					token.map = mapKey;
					token.encounter_type = "Water";
					token.species = new Uint16Array(token.args.buffer)[0];
				}
			}
			if ("fishing_encounters" in map) for (let i = 0; i < map.fishing_encounters.slots.length; i++) {
				let address = map.fishing_encounters.address + 2 + 4 * i;
				if (token.position == address) {
					token.name = "Fishing Encounter Slot " + i + " on Map " + mapKey;
					token.dexsanity = true;
					token.map = mapKey;
					token.encounter_type = {
						0: "Old Rod",
						1: "Old Rod",
						2: "Good Rod",
						3: "Good Rod",
						4: "Good Rod",
						5: "Super Rod",
						6: "Super Rod",
						7: "Super Rod",
						8: "Super Rod",
						9: "Super Rod"
					}[i];
					token.species = new Uint16Array(token.args.buffer)[0];
				}
			}
			if ("rock_smash_encounters" in map) for (let i = 0; i < map.rock_smash_encounters.slots.length; i++) {
				let address = map.rock_smash_encounters.address + 2 + 4 * i;
				if (token.position == address) {
					token.name = "Rock Smash Encounter Slot " + i + " on Map " + mapKey;
					token.dexsanity = true;
					token.map = mapKey;
					token.encounter_type = "Rock Smash";
					token.species = new Uint16Array(token.args.buffer)[0];
				}
			}
		}
	}
	return tokens;
}

async function loginToAP(server, username, password) {
	const statusEl = document.getElementById("configStatus");
	statusEl.textContent = "Connecting...";
	try {
		const ap_client = new Client();
		window.ap_client = ap_client;
		const logData = await ap_client.login(server, username, null, {
			password,
			version: {
				major: 0,
				minor: 6,
				build: 3
			},
			tags: ["Tracker", "NoText"],
			items: itemsHandlingFlags.all
		});
		ap_client.logData = logData;
		ap_client.socket.on("bounced", (packet) => {
			console.log("Bounce data", packet);
			if (packet.data && packet.data.mapId) tabMapping[packet.data.mapId] && document.querySelectorAll("#mapsContainer button").forEach((btn) => {
				if (btn.getAttribute("data-map") === tabMapping[packet.data.mapId]) btn.click();
			});
		});
		ap_client.socket.on("disconnected", async () => {
			try {
				await ap_client.login(server, username, null, {
					password,
					version: {
						major: 0,
						minor: 6,
						build: 6
					},
					tags: ["Tracker", "NoText"],
					items: itemsHandlingFlags.all
				});
			} catch (err) {
				console.error("Re-login failed", err);
			}
		});
		statusEl.textContent = "Connected as " + (logData && logData.playerName ? logData.playerName : username);
		document.title = (logData && logData.playerName ? logData.playerName : username) + " - Tracker";
		return {
			ap_client,
			logData
		};
	} catch (err) {
		console.error("Login failed", err);
		statusEl.textContent = "Connection failed: " + (err && err.message ? err.message : String(err));
		throw err;
	}

function extractPokemonPerMap(tokens) {
	let dexsanityData = tokens.filter((t) => t.dexsanity).map((t) => ({
		map: t.map,
		encounter_type: t.encounter_type,
		species: t.species
	}));
	let result = {};
	for (let entry of dexsanityData) {
		if (!result[entry.map]) result[entry.map] = {};
		if (!result[entry.map][entry.encounter_type]) result[entry.map][entry.encounter_type] = [];
		result[entry.map][entry.encounter_type].push(entry.species);
	}
	let speciesNameMap = {};
	let emerald_data = getData();
	for (let key in emerald_data.constants) if (key.startsWith("SPECIES_")) {
		const speciesId = emerald_data.constants[key];
		speciesNameMap[speciesId] = key.replace("SPECIES_", "");
	}
	for (let mapKey in result) {
		let mapData = result[mapKey];
		for (let encounterType in mapData) {
			let speciesList = mapData[encounterType];
			let total = speciesList.length;
			let counts = {};
			for (let species of speciesList) {
				if (!counts[species]) counts[species] = 0;
				counts[species]++;
			}
			let percentages = {};
			for (let species in counts) {
				const speciesName = speciesNameMap[species] || species;
				const id = pokemons.find((x) => x.name.replace("-", "_").toUpperCase() === speciesName.toUpperCase())?.number || "-" + species;
				percentages[speciesName] = {
					probability: counts[species] / total * 100,
					id,
					name: speciesName
				};
			}
			result[mapKey][encounterType] = percentages;
		}
	}
	return result;
}

function formatDisplayName(raw) {
	if (raw === void 0 || raw === null) return "";
	const s = String(raw);
	if (/^\d+$/.test(s)) return s;
	return s.replace(/_/g, " ").toLowerCase().split(" ").map((w) => {
		if (!w) return w;
		return w.charAt(0).toUpperCase() + w.slice(1);
	}).join(" ");
}
